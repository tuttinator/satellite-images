[project]
name = "satellite-images"
version = "0.1.0"
description = "Sentinel-2 forest-health viewer for carbon concessions around Palangka Raya"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "earthengine-api>=1.4",
  "python-dotenv>=1.0",
  "geopandas>=1.1.4",
  "pyogrio>=0.13.0",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "websocket-client>=1.9.0",
]
