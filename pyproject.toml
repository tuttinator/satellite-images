[project]
name = "satellite-images"
version = "0.1.0"
description = "Earth Engine tools for Indonesian forest, fire and haze monitoring: Sentinel-2 viewer, island fire seasons, daily smoke grids"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "earthengine-api>=1.4",
  "python-dotenv>=1.0",
  "numpy>=2.0",
  "geopandas>=1.1.4",
  "pyogrio>=0.13.0",
  "httpx>=0.28.1",
]

[dependency-groups]
# Installed by `uv sync` (dev group is on by default).
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "websocket-client>=1.9.0",  # scripts/screenshot.py only
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines in data tables / docstrings are fine

[tool.pytest.ini_options]
pythonpath = ["src"]
